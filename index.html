<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF 圖層與縮放檢視器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      display: flex;
      height: 100vh;
      background: #f0f2f5;
      color: #222;
    }
    #sidebar {
      width: 270px;
      flex-shrink: 0;
      background: #ffffff;
      border-right: 1px solid #d9dee7;
      padding: 14px;
      overflow-y: auto;
    }
    #sidebar h2 {
      margin: 0 0 10px;
      font-size: 17px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
    .layer-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
    }
    .layer-item:hover { background: #f5f7fa; }
    #main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #toolbar {
      background: #ffffff;
      border-bottom: 1px solid #d9dee7;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    button {
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 6px;
    }
    button:hover { background: #f1f5f9; }
    /* 以左上角為放大起點 */
    #viewer-container {
      flex: 1;
      overflow: auto;
      padding: 0;
      text-align: left;
    }
    canvas {
      display: block;
      margin: 0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      background: #fff;
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <h2>圖層 (Layers)</h2>
    <div id="layers-list">正在載入 PDF 與圖層...</div>
  </aside>

  <section id="main">
    <div id="toolbar">
      <button id="zoom-out">縮小 (-)</button>
      <span id="zoom-label">150%</span>
      <button id="zoom-in">放大 (+)</button>
      <button id="zoom-150">150%</button>
      <button id="zoom-reset">重設 100%</button>
    </div>
    <div id="viewer-container">
      <canvas id="pdf-canvas"></canvas>
    </div>
  </section>
