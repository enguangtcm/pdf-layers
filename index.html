<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>PDF 圖層、縮放與繪圖檢視器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      display: flex;
      height: 100vh;
      background: #f0f2f5;
      color: #222;
    }
    #sidebar {
      width: 150px;
      flex-shrink: 0;
      background: #ffffff;
      border-right: 1px solid #d9dee7;
      padding: 12px;
      overflow-y: auto;
      transition: width 0.2s ease, padding 0.2s ease;
    }
    #sidebar.collapsed {
      width: 0;
      padding: 0;
      overflow: hidden;
      border-right: none;
    }
    #sidebar h2 {
      margin: 0 0 10px;
      font-size: 16px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
      white-space: nowrap;
    }
    .layer-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 4px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
    }
    .layer-item:hover { background: #f5f7fa; }
    #main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .toolbar {
      background: #ffffff;
      border-bottom: 1px solid #d9dee7;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .toolbar.draw-bar {
      border-top: 1px solid #eef2f6;
      background: #fafbfd;
    }
    .toolbar.sticker-bar {
      border-top: 1px solid #eef2f6;
      background: #f8fafc;
    }
    .toolbar-divider {
      width: 1px;
      height: 20px;
      background: #d9dee7;
      margin: 0 2px;
    }
    button, select, input[type="number"] {
      padding: 5px 9px;
      font-size: 13.5px;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 6px;
      white-space: nowrap;
    }
    input[type="number"] {
      width: 62px;
      cursor: text;
    }
    button:hover:not(:disabled) { background: #f1f5f9; }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    button.active {
      background: #1d4ed8;
      color: #fff;
      border-color: #1d4ed8;
    }
    input[type="range"] {
      width: 82px;
      vertical-align: middle;
      cursor: pointer;
    }
    .inline-group {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
    }

    .palette-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .palette-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .palette-swatch-preview {
      width: 18px;
      height: 18px;
      border: 1px solid #64748b;
      border-radius: 3px;
      background: #ff0000;
      display: inline-block;
    }
    .palette-popover {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 236px;
      background: #ffffff;
      border: 1px solid #94a3b8;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
      border-radius: 4px;
      padding: 4px;
      z-index: 100;
      user-select: none;
    }
    .palette-popover.open {
      display: block;
    }
    .palette-auto-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      cursor: pointer;
      border-radius: 3px;
      font-size: 13px;
    }
    .palette-auto-row:hover { background: #e2e8f0; }
    .palette-auto-box {
      width: 18px;
      height: 18px;
      background: #ff0000;
      border: 1px solid #64748b;
    }
    .palette-section-title {
      background: #dde7f5;
      color: #1e3a8a;
      font-size: 12px;
      font-weight: bold;
      padding: 3px 6px;
      margin: 4px 0;
    }
    .palette-grid-10 {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 3px;
      padding: 2px 4px;
    }
    .palette-shades-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 0 3px;
      padding: 3px 4px 4px;
    }
    .palette-shade-col {
      display: flex;
      flex-direction: column;
      border: 1px solid #cbd5e1;
    }
    .palette-cell {
      width: 100%;
      height: 16px;
      border: 1px solid #cbd5e1;
      cursor: pointer;
      padding: 0;
      border-radius: 0;
    }
    .palette-shade-col .palette-cell {
      border: none;
      height: 14px;
    }
    .palette-cell:hover, .palette-cell.active-color {
      outline: 2px solid #ea580c;
      outline-offset: -1px;
      z-index: 2;
    }
    .palette-more-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      margin-top: 4px;
      border-top: 1px solid #e2e8f0;
      cursor: pointer;
      font-size: 13px;
    }
    .palette-more-row:hover { background: #e2e8f0; }

    .sticker-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 6px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
    }
    .sticker-btn:hover {
      background: #eff6ff;
      border-color: #3b82f6;
    }
    #viewer-container {
      flex: 1;
      overflow: auto;
      padding: 0;
      text-align: left;
    }
    #viewer-container.hand-mode {
      cursor: grab;
    }
    #viewer-container.hand-mode.hand-grabbing {
      cursor: grabbing;
      user-select: none;
    }
    #canvas-stack {
      position: relative;
      display: inline-block;
      margin: 0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      background: #fff;
    }
    #pdf-canvas {
      display: block;
    }
    #draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
      z-index: 3;
    }
    #vector-draw-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 4;
    }
    #vector-draw-layer.drawing-active {
      pointer-events: auto;
      touch-action: none;
    }
    .vector-shape-group {
      cursor: pointer;
      pointer-events: auto;
    }
    .vector-shape-group.selected {
      filter: drop-shadow(0 0 4px rgba(29, 78, 216, 0.85));
    }
    #eraser-cursor {
      display: none;
      position: absolute;
      border: 1.5px solid #334155;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.85);
      z-index: 9;
    }
    #overlay-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 5;
    }
    #overlay-layer.text-placing {
      pointer-events: auto;
      cursor: text;
    }
    .vector-sticker-item {
      position: absolute;
      cursor: move;
      user-select: none;
      touch-action: none;
      pointer-events: auto;
      z-index: 6;
    }
    .vector-sticker-item svg {
      display: block;
      overflow: visible;
    }
    .vector-sticker-item.selected svg {
      filter: drop-shadow(0 0 4px rgba(29, 78, 216, 0.7));
    }
    .sticker-del-badge {
      display: none;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 3px;
      background: #dc2626;
      color: #fff;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      z-index: 12;
    }
    .vector-sticker-item.selected .sticker-del-badge {
      display: inline-block;
    }

    /* 多行、可調長寬、文字距邊界 0.15cm 的文字框 */
    .floating-text-box {
      position: absolute;
      padding: 0.15cm;
      border: 1px dashed rgba(29, 78, 216, 0.65);
      background: rgba(255, 255, 255, 0.88);
      border-radius: 4px;
      cursor: move;
      user-select: none;
      touch-action: none;
      pointer-events: auto;
      line-height: 1.3;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      font-weight: bold;
      z-index: 7;
      white-space: pre-wrap;
      word-break: break-word;
      overflow: visible;
    }
    .floating-text-box.selected {
      border: 1.5px solid #1d4ed8;
      box-shadow: 0 2px 8px rgba(29, 78, 216, 0.25);
    }
    .floating-text-content {
      display: block;
      width: 100%;
      height: 100%;
    }
    .text-resize-handle {
      display: none;
      position: absolute;
      right: -5px;
      bottom: -5px;
      width: 11px;
      height: 11px;
      background: #1d4ed8;
      border: 1.5px solid #ffffff;
      border-radius: 2px;
      cursor: nwse-resize;
      z-index: 11;
    }
    .floating-text-box.selected .text-resize-handle {
      display: block;
    }
    .floating-text-actions {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 4px;
      gap: 4px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 12px;
      font-weight: normal;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      white-space: nowrap;
      z-index: 10;
    }
    .floating-text-box.selected .floating-text-actions {
      display: inline-flex;
    }
    .floating-text-actions span {
      cursor: pointer;
      padding: 1px 5px;
      color: #1e293b;
    }
    .floating-text-actions span:hover {
      background: #e2e8f0;
      border-radius: 3px;
    }
    .floating-text-actions span.del-btn {
      color: #dc2626;
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <h2>圖層 (Layers)</h2>
    <div id="layers-list">正在載入 PDF 與圖層...</div>
  </aside>

  <section id="main">
    <div class="toolbar">
      <button id="toggle-sidebar">收合圖層</button>
      <span class="toolbar-divider"></span>
      <button id="zoom-out">縮小 (-)</button>
      <span id="zoom-label">150%</span>
      <button id="zoom-in">放大 (+)</button>
      <button id="zoom-150">150%</button>
      <button id="zoom-reset">重設 100%</button>
      <span class="toolbar-divider"></span>
      <button id="tool-hand-top" title="手抓工具：按住上下左右拖曳移動圖面">🖐 手抓移動</button>
      <span class="toolbar-divider"></span>
      <button id="layers-check-all">全部勾選</button>
      <button id="layers-uncheck-all">全部取消</button>
    </div>

    <div class="toolbar draw-bar">
      <strong style="font-size: 13.5px;">繪圖工具：</strong>
      <button id="tool-none" class="active">瀏覽模式</button>
      <button id="tool-hand" title="按住圖面上下左右拖曳移動">🖐 手抓移動</button>
      <button id="tool-pen">隨意畫線</button>
      <button id="tool-line">直線</button>
      <button id="tool-arrow">箭頭</button>
      <button id="tool-circle">圓形</button>
      <button id="tool-rect">正方形</button>
      <button id="tool-text">加文字</button>

      <span class="inline-group">
        <button id="tool-eraser">橡皮擦</button>
        <input type="range" id="eraser-size" min="8" max="60" value="20" title="橡皮擦大小" />
        <span id="eraser-size-label">20</span>
      </span>

      <span class="toolbar-divider"></span>

      <div class="palette-wrapper" id="palette-wrapper">
        <button type="button" class="palette-trigger" id="palette-trigger" title="開啟調色盤">
          <span>顏色</span>
          <span class="palette-swatch-preview" id="palette-preview"></span>
          <span style="font-size: 10px;">▼</span>
        </button>
        <input type="color" id="draw-color" value="#ff0000" style="position:absolute; opacity:0; width:0; height:0; pointer-events:none;" />
        <div class="palette-popover" id="palette-popover">
          <div class="palette-auto-row" id="palette-auto-btn">
            <span class="palette-auto-box"></span>
            <span>自動(A)</span>
          </div>
          <div class="palette-section-title">佈景主題色彩</div>
          <div class="palette-grid-10" id="palette-theme-top"></div>
          <div class="palette-shades-grid" id="palette-theme-shades"></div>
          <div class="palette-section-title">標準色彩</div>
          <div class="palette-grid-10" id="palette-standard"></div>
          <div class="palette-more-row" id="palette-more-btn">
            <span>🎨</span>
            <span>其他色彩(M)...</span>
          </div>
        </div>
      </div>

      <label class="inline-group">線寬
        <select id="line-width">
          <option value="2">細</option>
          <option value="5" selected>中等</option>
          <option value="9">粗</option>
        </select>
      </label>

      <label class="inline-group">字級(8-36)
        <input type="number" id="font-size" min="8" max="36" value="20" />
      </label>

      <button id="draw-undo" disabled>復原上一步</button>
      <button id="draw-clear">清除筆跡</button>
      <span class="toolbar-divider"></span>
      <button id="download-png">下載 PNG</button>
    </div>

    <div class="toolbar sticker-bar">
      <strong style="font-size: 13.5px;">向量貼紙區：</strong>
      <div id="sticker-buttons" style="display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap;"></div>
      <span class="toolbar-divider"></span>
      <label class="inline-group">貼紙大小
        <input type="range" id="sticker-scale" min="0.3" max="3.0" step="0.1" value="1.0" />
        <span id="sticker-scale-label">1.0x</span>
      </label>
    </div>

    <div id="viewer-container">
      <div id="canvas-stack">
        <canvas id="pdf-canvas" width="600" height="360"></canvas>
        <canvas id="draw-canvas" width="600" height="360"></canvas>
        <svg id="vector-draw-layer" width="600" height="360" viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="eraser-cursor"></div>
        <div id="overlay-layer" style="width:600px;height:360px;"></div>
      </div>
    </div>
  </section>

  <script>
    const FONT_FAMILY = '"Microsoft JhengHei", "Noto Sans TC", sans-serif';
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const BASE_SCALE = 1.5;

    // 0.15cm 換算為 96 DPI 螢幕像素（1 inch = 2.54 cm -> 0.15 / 2.54 * 96 ≈ 5.67 px）
    function getPad015CmPx(zoomRatio = getZoomRatio()) {
      return (0.15 / 2.54) * 96 * zoomRatio;
    }

    const THEME_BASE_COLORS = [
      '#ffffff', '#000000', '#eeece1', '#1f497d', '#4f81bd',
      '#c0504d', '#9bbb59', '#8064a2', '#4bacc6', '#f79646'
    ];
    const THEME_SHADE_COLUMNS = [
      ['#f2f2f2', '#d9d9d9', '#bfbfbf', '#a6a6a6', '#808080'],
      ['#7f7f7f', '#595959', '#3f3f3f', '#262626', '#0d0d0d'],
      ['#ddd9c3', '#c4bd97', '#938953', '#494429', '#1d1b10'],
      ['#c6d9f0', '#8db3e2', '#548dd4', '#17365d', '#0f243e'],
      ['#dbe5f1', '#b8cce4', '#95b3d7', '#366092', '#244062'],
      ['#f2dcdb', '#e5b9b7', '#d99694', '#953734', '#632423'],
      ['#ebf1dd', '#d7e3bc', '#c3d69b', '#76923c', '#4f6128'],
      ['#e5e0ec', '#ccc1d9', '#b2a2c7', '#5f497a', '#3f3151'],
      ['#dbeef3', '#b7dde8', '#92cddc', '#31859b', '#205867'],
      ['#fdeada', '#fbd5b5', '#fac08f', '#e36c09', '#974806']
    ];
    const STANDARD_COLORS = [
      '#c00000', '#ff0000', '#ffc000', '#ffff00', '#92d050',
      '#00b050', '#00b0f0', '#0070c0', '#002060', '#7030a0'
    ];

    const STICKER_DEFS = [
      { key: 'wood', label: '木', shape: 'ring', fill: 'none', stroke: '#0000ff', textColor: '#0000ff' },
      { key: 'fire_wuxing', label: '火', shape: 'ring', fill: 'none', stroke: '#ff0000', textColor: '#ff0000' },
      { key: 'earth', label: '土', shape: 'ring', fill: 'none', stroke: '#f5b800', textColor: '#f5b800' },
      { key: 'metal', label: '金', shape: 'ring', fill: 'none', stroke: '#b3b3b3', textColor: '#b3b3b3' },
      { key: 'water', label: '水', shape: 'ring', fill: 'none', stroke: '#000000', textColor: '#000000' },
      { key: 'wind', label: '風', shape: 'circle', fill: '#00f0ff', textColor: '#ffffff' },
      { key: 'cold', label: '寒', shape: 'circle', fill: '#000000', textColor: '#ffffff' },
      { key: 'summer', label: '暑', shape: 'circle', fill: '#ff00ff', textColor: '#ffffff' },
      { key: 'damp', label: '濕', shape: 'circle', fill: '#ff8000', textColor: '#ffffff' },
      { key: 'dry', label: '燥', shape: 'circle', fill: '#a6a6a6', textColor: '#ffffff' },
      { key: 'fire_xie', label: '火', shape: 'circle', fill: '#ff0000', textColor: '#ffffff' },
      { key: 'bacteria', label: '細菌', shape: 'oval', fill: 'none', stroke: '#000000', textColor: '#000000' },
      { key: 'virus', label: '病毒', shape: 'oval', fill: 'none', stroke: '#000000', textColor: '#000000' },
    ];

    window.__APP_STATE__ = window.__APP_STATE__ || { scale: BASE_SCALE };

    let activeTool = 'none';
    let isDrawing = false;
    let penRelPoints = [];
    let draftVectorShape = null;
    let hasStrokeMoved = false;
    const undoStack = [];
    const MAX_UNDO = 30;

    let vectorShapes = [];
    let selectedShapeId = null;

    // textItem 支援多行、自訂寬高比例（nw, nh，若為 null 則自動貼合文字大小）
    let textItems = [];
    let selectedTextId = null;
    let draggingTextId = null;
    let resizingTextId = null;
    let textDragOffsetX = 0;
    let textDragOffsetY = 0;
    let textResizeStartX = 0;
    let textResizeStartY = 0;
    let textResizeStartW = 0;
    let textResizeStartH = 0;

    let stickerItems = [];
    let selectedStickerId = null;
    let draggingStickerId = null;
    let stickerDragOffsetX = 0;
    let stickerDragOffsetY = 0;

    const sidebarEl = document.getElementById('sidebar');
    const toggleSidebarBtn = document.getElementById('toggle-sidebar');
    const canvas = document.getElementById('pdf-canvas');
    const drawCanvas = document.getElementById('draw-canvas');
    const drawCtx = drawCanvas.getContext('2d');
    const vectorDrawLayerEl = document.getElementById('vector-draw-layer');
    const eraserCursorEl = document.getElementById('eraser-cursor');
    const overlayLayerEl = document.getElementById('overlay-layer');
    const stickerButtonsEl = document.getElementById('sticker-buttons');
    const stickerScaleInput = document.getElementById('sticker-scale');
    const stickerScaleLabel = document.getElementById('sticker-scale-label');
    const viewerContainerEl = document.getElementById('viewer-container');
    const colorInput = document.getElementById('draw-color');
    const paletteTrigger = document.getElementById('palette-trigger');
    const palettePreview = document.getElementById('palette-preview');
    const palettePopover = document.getElementById('palette-popover');
    const lineWidthSelect = document.getElementById('line-width');
    const fontSizeInput = document.getElementById('font-size');
    const eraserSizeInput = document.getElementById('eraser-size');
    const eraserSizeLabel = document.getElementById('eraser-size-label');
    const undoBtn = document.getElementById('draw-undo');
    const clearBtn = document.getElementById('draw-clear');
    const downloadPngBtn = document.getElementById('download-png');

    function getCurrentScale() {
      return window.__APP_STATE__?.scale || BASE_SCALE;
    }

    function getZoomRatio() {
      return getCurrentScale() / BASE_SCALE;
    }

    function getLayerDimensions() {
      return { w: canvas.width || 600, h: canvas.height || 360 };
    }

    function pxToRel(x, y) {
      const { w, h } = getLayerDimensions();
      return {
        nx: Math.max(0, Math.min(1, x / w)),
        ny: Math.max(0, Math.min(1, y / h)),
      };
    }

    function relToPx(nx, ny) {
      const { w, h } = getLayerDimensions();
      return { x: nx * w, y: ny * h };
    }

    function setSelectedColor(hex) {
      colorInput.value = hex;
      if (palettePreview) palettePreview.style.background = hex;
      document.querySelectorAll('.palette-cell').forEach((cell) => {
        cell.classList.toggle('active-color', cell.dataset.color?.toLowerCase() === hex.toLowerCase());
      });
      if (selectedTextId !== null) {
        const target = textItems.find((t) => t.id === selectedTextId);
        if (target && target.color !== hex) {
          pushUndoState();
          target.color = hex;
          renderOverlays();
        }
      }
      if (selectedShapeId !== null) {
        const targetShape = vectorShapes.find((s) => s.id === selectedShapeId);
        if (targetShape && targetShape.color !== hex) {
          pushUndoState();
          targetShape.color = hex;
          renderVectorShapes();
        }
      }
    }

    function initColorPalette() {
      const themeTopEl = document.getElementById('palette-theme-top');
      const themeShadesEl = document.getElementById('palette-theme-shades');
      const standardEl = document.getElementById('palette-standard');

        const text = document.createElementNS(SVG_NS, 'text');

        const text = document.createElementNS(SVG_NS, 'text');

        text.setAttribute('fill', def.textColor);
        text.setAttribute('font-size', '44');
        text.setAttribute('font-weight', 'bold');
        text.setAttribute('font-family', FONT_FAMILY);
        text.textContent = def.label;
        svg.appendChild(text);
      }
      return svg;
    }

    function initStickerButtons() {
      if (!stickerButtonsEl) return;

      for (const def of STICKER_DEFS) {

        btn.addEventListener('click', () => {

    function updateEraserCursorSize() {

    function updateEraserCursorPosition(x, y) {
      if (activeTool !== 'eraser') {
        eraserCursorEl.style.display = 'none';

      }
      updateEraserCursorSize();
      eraserCursorEl.style.left = `${x}px`;

    eraserSizeInput?.addEventListener('input', () => {

    function clampFontSize(val) {
      const num = parseInt(val, 10);
      if (Number.isNaN(num)) return 20;
      return Math.min(36, Math.max(8, num));
    }

    fontSizeInput?.addEventListener('change', () => {
      const validSize = clampFontSize(fontSizeInput.value);
      fontSizeInput.value = validSize;
      if (selectedTextId !== null) {
        const target = textItems.find((t) => t.id === selectedTextId);
        if (target && target.fontSize !== validSize) {
          pushUndoState();
          target.fontSize = validSize;
          renderOverlays();
        }
      }
    });

    function cloneVectorShape(shape) {
      return {
        ...shape,
        points: shape.points ? shape.points.map((p) => ({ ...p })) : undefined,
      };
    }

    function createSnapshotRecord() {
      return {
        canvasDataUrl: drawCanvas.toDataURL('image/png'),
        shapes: vectorShapes.map(cloneVectorShape),
        texts: textItems.map((t) => ({ ...t })),
        stickers: stickerItems.map((s) => ({ ...s })),
      };
    }

    function updateUndoButton() {
      if (undoBtn) undoBtn.disabled = undoStack.length === 0;
    }

    function pushUndoState() {
      if (drawCanvas.width === 0 || drawCanvas.height === 0) return;
      undoStack.push(createSnapshotRecord());
      if (undoStack.length > MAX_UNDO) undoStack.shift();
      updateUndoButton();
    }

    function restoreRecord(record) {
      return new Promise((resolve) => {
        vectorShapes = (record.shapes || []).map(cloneVectorShape);
        textItems = (record.texts || []).map((t) => ({ ...t }));
        stickerItems = (record.stickers || []).map((s) => ({ ...s }));
        selectedShapeId = null;
        selectedTextId = null;
        selectedStickerId = null;
        draftVectorShape = null;
        renderVectorShapes();
        renderOverlays();

        const img = new Image();
        img.onload = () => {
          drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
          drawCtx.drawImage(img, 0, 0, drawCanvas.width, drawCanvas.height);
          resolve();
        };
        img.src = record.canvasDataUrl;
      });
    }

    undoBtn?.addEventListener('click', async () => {
      if (undoStack.length === 0) return;
      const prevRecord = undoStack.pop();
      updateUndoButton();
      await restoreRecord(prevRecord);
    });

    clearBtn?.addEventListener('click', () => {
      const hasAnyPixel = drawCtx
        .getImageData(0, 0, drawCanvas.width || 1, drawCanvas.height || 1)
        .data.some((alpha) => alpha !== 0);
      if (hasAnyPixel || vectorShapes.length > 0 || textItems.length > 0 || stickerItems.length > 0) {
        pushUndoState();
      }
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      vectorShapes = [];
      textItems = [];
      stickerItems = [];
      selectedShapeId = null;
      selectedTextId = null;
      selectedStickerId = null;
      draftVectorShape = null;
      renderVectorShapes();
      renderOverlays();
    });

    // ---------------------------------------------------------
    // 局部精準橡皮擦：將線段中落在橡皮擦半徑內的點/段裁切掉，保留其餘部分
    // ---------------------------------------------------------
    function distToSegment(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      if (lenSq === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    }

    function splitPolylineByEraser(points, px, py, radius) {
      const { w, h } = getLayerDimensions();
      if (!Array.isArray(points) || points.length === 0) return { segments: [], modified: false };

      if (points.length === 1) {
        const p0 = points[0];
        const hit = Math.hypot(px - p0.nx * w, py - p0.ny * h) <= radius;
        return hit ? { segments: [], modified: true } : { segments: [[{ ...p0 }]], modified: false };
      }

      const segments = [];
      let currentSeg = [];
      let modified = false;

      for (let i = 0; i < points.length - 1; i++) {
        const a = points[i];
        const b = points[i + 1];
        const ax = a.nx * w;
        const ay = a.ny * h;
        const bx = b.nx * w;
        const by = b.ny * h;

        const aHit = Math.hypot(px - ax, py - ay) <= radius;
        const bHit = Math.hypot(px - bx, py - by) <= radius;
        const segHit = distToSegment(px, py, ax, ay, bx, by) <= radius;

        if (!segHit) {
          if (currentSeg.length === 0) currentSeg.push({ ...a });
          currentSeg.push({ ...b });
        } else {
          modified = true;
          if (!aHit) {
            if (currentSeg.length === 0) currentSeg.push({ ...a });
            if (currentSeg.length > 0) {
              segments.push(currentSeg);
              currentSeg = [];
            }
          } else if (currentSeg.length > 0) {
            segments.push(currentSeg);
            currentSeg = [];
          }
          if (!bHit) {
            currentSeg = [{ ...b }];
          }
        }
      }

      if (currentSeg.length > 0) {
        segments.push(currentSeg);
      }

      return { segments, modified };
    }

    function sampleSegmentPoints(nx1, ny1, nx2, ny2, steps = 28) {
      const pts = [];
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        pts.push({
          nx: nx1 + (nx2 - nx1) * t,
          ny: ny1 + (ny2 - ny1) * t,
        });
      }
      return pts;
    }

    function sampleRectPoints(nx1, ny1, nx2, ny2) {
      const minX = Math.min(nx1, nx2);
      const maxX = Math.max(nx1, nx2);
      const minY = Math.min(ny1, ny2);
      const maxY = Math.max(ny1, ny2);
      return [
        ...sampleSegmentPoints(minX, minY, maxX, minY, 16),
        ...sampleSegmentPoints(maxX, minY, maxX, maxY, 16),
        ...sampleSegmentPoints(maxX, maxY, minX, maxY, 16),
        ...sampleSegmentPoints(minX, maxY, minX, minY, 16),
      ];
    }

    function sampleCirclePoints(nx1, ny1, nx2, ny2, steps = 64) {
      const rx = Math.abs(nx2 - nx1) / 2;
      const ry = Math.abs(ny2 - ny1) / 2;
      const cx = Math.min(nx1, nx2) + rx;
      const cy = Math.min(ny1, ny2) + ry;
      const pts = [];
      for (let i = 0; i <= steps; i++) {
        const theta = (i / steps) * Math.PI * 2;
        pts.push({
          nx: cx + rx * Math.cos(theta),
          ny: cy + ry * Math.sin(theta),
        });
      }
      return pts;
    }

    function eraseVectorShapesAt(px, py) {
      const radius = Number(eraserSizeInput?.value || 20) / 2;
      if (vectorShapes.length === 0) return false;

      let anyModified = false;
      const nextShapes = [];

      for (const shape of vectorShapes) {
        const hitPad = radius + Math.max(2, (shape.lineWidth * getZoomRatio()) / 2);

        if (shape.type === 'pen') {
          const { segments, modified } = splitPolylineByEraser(shape.points, px, py, hitPad);
          if (modified) {
            anyModified = true;
            segments.forEach((segPts, idx) => {
              if (segPts.length >= 2) {
                nextShapes.push({
                  ...cloneVectorShape(shape),
                  id: idx === 0 ? shape.id : `${shape.id}_part_${idx}_${Date.now()}`,
                  points: segPts,
                });
              }
            });
          } else {
            nextShapes.push(shape);
          }
        } else if (shape.type === 'line' || shape.type === 'arrow') {
          const pts = sampleSegmentPoints(shape.nx1, shape.ny1, shape.nx2, shape.ny2, 32);
          const { segments, modified } = splitPolylineByEraser(pts, px, py, hitPad);
          if (modified) {
            anyModified = true;
            segments.forEach((segPts, idx) => {
              if (segPts.length >= 2) {
                nextShapes.push({
                  id: `${shape.id}_seg_${idx}_${Date.now()}`,
                  type: 'pen',
                  points: segPts,
                  lineWidth: shape.lineWidth,
                  color: shape.color,
                });
              }
            });
          } else {
            nextShapes.push(shape);
          }
        } else if (shape.type === 'rect') {
          const pts = sampleRectPoints(shape.nx1, shape.ny1, shape.nx2, shape.ny2);
          const { segments, modified } = splitPolylineByEraser(pts, px, py, hitPad);
          if (modified) {
            anyModified = true;
            segments.forEach((segPts, idx) => {
              if (segPts.length >= 2) {
                nextShapes.push({
                  id: `${shape.id}_rect_${idx}_${Date.now()}`,
                  type: 'pen',
                  points: segPts,
                  lineWidth: shape.lineWidth,
                  color: shape.color,
                });
              }
            });
          } else {
            nextShapes.push(shape);
          }
        } else if (shape.type === 'circle') {
          const pts = sampleCirclePoints(shape.nx1, shape.ny1, shape.nx2, shape.ny2, 72);
          const { segments, modified } = splitPolylineByEraser(pts, px, py, hitPad);
          if (modified) {
            anyModified = true;
            segments.forEach((segPts, idx) => {
              if (segPts.length >= 2) {
                nextShapes.push({
                  id: `${shape.id}_arc_${idx}_${Date.now()}`,
                  type: 'pen',
                  points: segPts,
                  lineWidth: shape.lineWidth,
                  color: shape.color,
                });
              }
            });
          } else {
            nextShapes.push(shape);
          }
        } else {
          nextShapes.push(shape);
        }
      }

      if (anyModified) {
        vectorShapes = nextShapes;
        if (selectedShapeId && !vectorShapes.some((s) => s.id === selectedShapeId)) {
          selectedShapeId = null;
        }
        renderVectorShapes();
      }
      return anyModified;
    }

    function buildVectorShapeNode(shape, zoomRatio = getZoomRatio()) {
      const { w, h } = getLayerDimensions();
      const g = document.createElementNS(SVG_NS, 'g');
      g.classList.add('vector-shape-group');
      if (shape.id === selectedShapeId) g.classList.add('selected');

      const strokeWidth = Math.max(1, shape.lineWidth * zoomRatio);
      const color = shape.color;

      if (shape.type === 'pen' && Array.isArray(shape.points) && shape.points.length > 0) {
        const d = shape.points
          .map((pt, idx) => `${idx === 0 ? 'M' : 'L'} ${(pt.nx * w).toFixed(1)} ${(pt.ny * h).toFixed(1)}`)
          .join(' ');
        const path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', color);
        path.setAttribute('stroke-width', strokeWidth);
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        g.appendChild(path);
      } else if (shape.type === 'line') {
        const line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('x1', shape.nx1 * w);
        line.setAttribute('y1', shape.ny1 * h);
        line.setAttribute('x2', shape.nx2 * w);
        line.setAttribute('y2', shape.ny2 * h);
        line.setAttribute('stroke', color);
        line.setAttribute('stroke-width', strokeWidth);
        line.setAttribute('stroke-linecap', 'round');
        g.appendChild(line);
      } else if (shape.type === 'arrow') {
        const x1 = shape.nx1 * w;
        const y1 = shape.ny1 * h;
        const x2 = shape.nx2 * w;
        const y2 = shape.ny2 * h;
        const headLen = Math.max(8, strokeWidth * 3.2);
        const angle = Math.atan2(y2 - y1, x2 - x1);

        const line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('stroke', color);
        line.setAttribute('stroke-width', strokeWidth);
        line.setAttribute('stroke-linecap', 'round');
        g.appendChild(line);

        const p1x = x2 - headLen * Math.cos(angle - Math.PI / 6);
        const p1y = y2 - headLen * Math.sin(angle - Math.PI / 6);
        const p2x = x2 - headLen * Math.cos(angle + Math.PI / 6);
        const p2y = y2 - headLen * Math.sin(angle + Math.PI / 6);

        const head = document.createElementNS(SVG_NS, 'polygon');
        head.setAttribute('points', `${x2},${y2} ${p1x.toFixed(1)},${p1y.toFixed(1)} ${p2x.toFixed(1)},${p2y.toFixed(1)}`);
        head.setAttribute('fill', color);
        g.appendChild(head);
      } else if (shape.type === 'circle') {
        const x1 = shape.nx1 * w;
        const y1 = shape.ny1 * h;
        const x2 = shape.nx2 * w;
        const y2 = shape.ny2 * h;
        const rx = Math.max(1, Math.abs(x2 - x1) / 2);
        const ry = Math.max(1, Math.abs(y2 - y1) / 2);
        const cx = Math.min(x1, x2) + rx;
        const cy = Math.min(y1, y2) + ry;

        const ellipse = document.createElementNS(SVG_NS, 'ellipse');
        ellipse.setAttribute('cx', cx);
        ellipse.setAttribute('cy', cy);
        ellipse.setAttribute('rx', rx);
        ellipse.setAttribute('ry', ry);
        ellipse.setAttribute('fill', 'none');
        ellipse.setAttribute('stroke', color);
        ellipse.setAttribute('stroke-width', strokeWidth);
        g.appendChild(ellipse);
      } else if (shape.type === 'rect') {
        const x1 = shape.nx1 * w;
        const y1 = shape.ny1 * h;
        const x2 = shape.nx2 * w;
        const y2 = shape.ny2 * h;
        const rect = document.createElementNS(SVG_NS, 'rect');
        rect.setAttribute('x', Math.min(x1, x2));
        rect.setAttribute('y', Math.min(y1, y2));
        rect.setAttribute('width', Math.abs(x2 - x1));
        rect.setAttribute('height', Math.abs(y2 - y1));
        rect.setAttribute('fill', 'none');
        rect.setAttribute('stroke', color);
        rect.setAttribute('stroke-width', strokeWidth);
        g.appendChild(rect);
      }
      return g;
    }

    function renderVectorShapes() {
      vectorDrawLayerEl.innerHTML = '';
      for (const shape of vectorShapes) {
        const node = buildVectorShapeNode(shape);
        node.addEventListener('click', (e) => {
          if (activeTool === 'eraser') {
            e.stopPropagation();
            const pt = getStackCoords(e, vectorDrawLayerEl);
            pushUndoState();
            eraseVectorShapesAt(pt.x, pt.y);
            return;
          }
          if (activeTool === 'none') {
            e.stopPropagation();
            selectedShapeId = selectedShapeId === shape.id ? null : shape.id;
            selectedTextId = null;
            selectedStickerId = null;
            renderVectorShapes();
            renderOverlays();
          }
        });
        vectorDrawLayerEl.appendChild(node);
      }
      if (draftVectorShape) {
        vectorDrawLayerEl.appendChild(buildVectorShapeNode(draftVectorShape));
      }
    }

    window.__APP_STATE__.renderVectorShapes = renderVectorShapes;

    window.addEventListener('keydown', (e) => {
      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedShapeId !== null) {
        const tag = document.activeElement?.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        pushUndoState();
        vectorShapes = vectorShapes.filter((s) => s.id !== selectedShapeId);
        selectedShapeId = null;
        renderVectorShapes();
      }
    });

    function renderOverlays() {
      overlayLayerEl.innerHTML = '';
      const zoomRatio = getZoomRatio();
      const { w: layerW, h: layerH } = getLayerDimensions();
      const padPx = getPad015CmPx(zoomRatio);

      for (const sItem of stickerItems) {
        const def = STICKER_DEFS.find((d) => d.key === sItem.key);
        if (!def) continue;

        const posPx = relToPx(sItem.nx, sItem.ny);
        const wrap = document.createElement('div');
        wrap.className = 'vector-sticker-item' + (sItem.id === selectedStickerId ? ' selected' : '');
        wrap.style.left = `${posPx.x}px`;

      const normalized = String(name || '')
        .replace(/[０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xfee0))

      const match = normalized.match(/^(\d+)/);

      if (!optionalContentConfig) {

      const groups = optionalContentConfig.getGroups();
      if (!groups || Object.keys(groups).length === 0) {
        layersListEl.textContent = '找不到可用圖層';
        return;

      for (const [groupId, group] of Object.entries(groups)) {
        if (isHiddenLayer(group.name || groupId)) {
          optionalContentConfig.setVisibility(groupId, false);

        .filter(([groupId, group]) => !isHiddenLayer(group.name || groupId))
        .sort((a, b) => {
          const nameA = a[1].name || a[0];
          const nameB = b[1].name || b[0];
          const numA = extractLeadingNumber(nameA);
          const numB = extractLeadingNumber(nameB);
          if (numA !== numB) return numA - numB;
          return String(nameA).localeCompare(String(nameB), 'zh-Hant');

          await renderPage();

      drawCtx.drawImage(prevDrawing, 0, 0, drawCanvas.width, drawCanvas.height);

      vectorDrawLayerEl.setAttribute('width', viewport.width);
      vectorDrawLayerEl.setAttribute('height', viewport.height);
      vectorDrawLayerEl.setAttribute('viewBox', `0 0 ${viewport.width} ${viewport.height}`);
      vectorDrawLayerEl.style.width = `${viewport.width}px`;
      vectorDrawLayerEl.style.height = `${viewport.height}px`;
      window.__APP_STATE__.renderVectorShapes?.();

      overlayLayerEl.style.width = `${viewport.width}px`;
      overlayLayerEl.style.height = `${viewport.height}px`;
      window.__APP_STATE__.renderOverlays?.();

      renderTask = page.render({
        canvasContext: ctx,
        viewport,
        optionalContentConfigPromise: Promise.resolve(optionalContentConfig),
      });

      try {
        await renderTask.promise;
      } catch (err) {
        if (err?.name !== 'RenderingCancelledException') console.error(err);
      }
    }

    document.getElementById('zoom-in')?.addEventListener('click', async () => {
      window.__APP_STATE__.scale = Math.min(6.0, +(window.__APP_STATE__.scale + 0.5).toFixed(2));
      await renderPage();
    });
    document.getElementById('zoom-out')?.addEventListener('click', async () => {
      window.__APP_STATE__.scale = Math.max(0.25, +(window.__APP_STATE__.scale - 0.5).toFixed(2));
      await renderPage();
    });
    document.getElementById('zoom-150')?.addEventListener('click', async () => {
      window.__APP_STATE__.scale = 1.5;
      await renderPage();
    });
    document.getElementById('zoom-reset')?.addEventListener('click', async () => {
      window.__APP_STATE__.scale = 1.0;
      await renderPage();
    });
    document.getElementById('layers-check-all')?.addEventListener('click', async () => {
      await setAllLayersVisibility(true);
    });
    document.getElementById('layers-uncheck-all')?.addEventListener('click', async () => {
      await setAllLayersVisibility(false);
    });

    async function loadPdfJs() {
      const cdns = [
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs',
        'https://unpkg.com/pdfjs-dist@4.6.82/build/pdf.min.mjs',
      ];
      for (const url of cdns) {
        try {
          const mod = await import(url);
          mod.GlobalWorkerOptions.workerSrc = url.replace('/pdf.min.mjs', '/pdf.worker.min.mjs');
          return mod;
        } catch (_) {}
      }
      throw new Error('無法載入 PDF.js 函式庫，請檢查網路連線。');
    }

    async function initPdf() {
      try {
        const pdfjsLib = await loadPdfJs();
        const loadingTask = pdfjsLib.getDocument(PDF_URL);
        pdfDoc = await loadingTask.promise;

        try {
          optionalContentConfig = await pdfDoc.getOptionalContentConfig();
        } catch (_) {
          optionalContentConfig = null;
        }

        await renderLayersUI();
        await renderPage();
      } catch (err) {
        if (layersListEl) {
          layersListEl.textContent = `載入失敗：${err?.message || '請確認 chart.pdf 是否在同一層'}`;
        }
        console.error(err);
      }
    }

    initPdf();
  </script>
</body>
</html>
